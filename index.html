<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Трекинг времени</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ── Reset & Theme ─────────────────────────────── */
:root {
  --bg:       var(--tg-theme-bg-color, #ffffff);
  --text:     var(--tg-theme-text-color, #000000);
  --hint:     var(--tg-theme-hint-color, #999999);
  --link:     var(--tg-theme-link-color, #2481cc);
  --btn:      var(--tg-theme-button-color, #2481cc);
  --btn-text: var(--tg-theme-button-text-color, #ffffff);
  --sec-bg:   var(--tg-theme-secondary-bg-color, #f2f2f7);
  --sep:      rgba(128,128,128,0.18);
  --r: 14px;
  --nav-h: 56px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--sec-bg);
  color: var(--text);
  font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ─────────────────────────────────────── */
#app { height: 100dvh; display: flex; flex-direction: column; }
#pages { flex: 1; overflow: hidden; position: relative; }
.page {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  padding: 16px 16px 32px;
  opacity: 0; pointer-events: none;
  transform: translateY(8px);
  transition: opacity .22s ease, transform .22s ease;
  -webkit-overflow-scrolling: touch;
}
.page.active { opacity: 1; pointer-events: auto; transform: translateY(0); }

/* ── Top Nav ──────────────────────────────────── */
#nav {
  height: var(--nav-h);
  background: var(--bg);
  border-bottom: 1px solid var(--sep);
  display: flex;
  padding-top: env(safe-area-inset-top);
  flex-shrink: 0;
  padding: 8px 12px;
  gap: 6px;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: row;
  align-items: center; justify-content: center;
  gap: 6px; cursor: pointer; border: none;
  background: transparent;
  border-radius: 10px;
  color: var(--hint); transition: color .15s, background .15s;
  padding: 8px 4px;
}
.nav-btn.active { color: var(--btn); background: rgba(36,129,204,.10); }
.nav-btn svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
.nav-btn span { font-size: 14px; font-weight: 600; letter-spacing: 0.1px; }

/* ── Section header ──────────────────────────────── */
.sec-title {
  font-size: 13px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.4px; color: var(--hint);
  padding: 0 4px 8px;
}

/* ── Card list ───────────────────────────────────── */
.card {
  background: var(--bg);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 20px;
}
.row {
  display: flex; align-items: center;
  padding: 0 16px; min-height: 52px;
  border-bottom: 1px solid var(--sep);
  cursor: default;
  transition: background .12s;
}
.row:last-child { border-bottom: none; }
.row.tappable { cursor: pointer; }
.row.tappable:active { background: var(--sec-bg); }
.row-label {
  flex: 0 0 100px; font-size: 16px; color: var(--text);
}
.row-value {
  flex: 1; text-align: right;
  font-size: 16px; color: var(--hint);
  display: flex; align-items: center; justify-content: flex-end; gap: 6px;
}
.row-value.filled { color: var(--text); }
.row-value.accent { color: var(--btn); font-weight: 600; font-size: 20px; }
.row-chevron { width: 16px; height: 16px; fill: var(--hint); flex-shrink: 0; }

/* Textarea row */
.row-textarea {
  flex-direction: column; align-items: flex-start;
  padding: 12px 16px; min-height: 80px;
  justify-content: flex-start;
}
.row-textarea textarea {
  width: 100%; background: transparent; border: none; outline: none;
  font-size: 16px; color: var(--text); resize: none;
  line-height: 1.45; margin-top: 4px;
  font-family: inherit;
  vertical-align: top;
}
.row-textarea textarea::placeholder { color: var(--hint); }

/* ── Stepper ─────────────────────────────────────── */
.stepper {
  display: flex; align-items: center; gap: 10px;
}
.step-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: none; background: var(--btn); color: var(--btn-text);
  font-size: 22px; font-weight: 300; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: 0; padding-bottom: 1px;
  transition: opacity .1s;
}
.step-btn:active { opacity: .7; }
.step-val {
  min-width: 44px; text-align: center;
  font-size: 20px; font-weight: 600; color: var(--btn);
}
.step-unit { font-size: 14px; color: var(--hint); }

/* ── Primary button ──────────────────────────────── */
.btn-primary {
  width: 100%; padding: 16px;
  background: var(--btn); color: var(--btn-text);
  border: none; border-radius: var(--r);
  font-size: 17px; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 12px;
}
.btn-primary:active { opacity: .75; }
.btn-primary:disabled { opacity: .35; cursor: default; }

.btn-secondary {
  width: 100%; padding: 13px;
  background: transparent; color: var(--btn);
  border: 1.5px solid var(--btn); border-radius: var(--r);
  font-size: 15px; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
  margin-bottom: 12px;
}
.btn-secondary:active { opacity: .7; }

.btn-delete {
  width: 100%; padding: 13px;
  background: transparent; color: #ff3b30;
  border: 1.5px solid rgba(255,59,48,.4); border-radius: var(--r);
  font-size: 15px; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
  margin-bottom: 12px;
  touch-action: manipulation;
}
.btn-delete:active { opacity: .7; }

/* ── Success state ───────────────────────────────── */
#add-success {
  display: none; flex-direction: column; align-items: center;
  padding: 40px 20px; text-align: center;
}
#add-success .check-circle {
  width: 72px; height: 72px; border-radius: 50%;
  background: #34c759; display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
  animation: pop .3s cubic-bezier(.36,1.56,.64,1);
}
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
#add-success .check-circle svg { width: 36px; height: 36px; fill: white; }
#add-success h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
#add-success p { color: var(--hint); font-size: 15px; margin-bottom: 28px; }

/* ── Analytics ───────────────────────────────────── */
.period-tabs {
  display: flex; gap: 6px; margin-bottom: 16px;
  background: var(--bg); border-radius: var(--r); padding: 4px;
}
.period-tab {
  flex: 1; padding: 8px 4px; border: none; border-radius: 10px;
  background: transparent; color: var(--hint);
  font-size: 14px; font-weight: 500; cursor: pointer;
  transition: background .15s, color .15s;
}
.period-tab.active {
  background: var(--btn); color: var(--btn-text);
}

.stat-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 16px;
}
.stat-card {
  background: var(--bg); border-radius: var(--r);
  padding: 16px;
}
.stat-card .stat-val {
  font-size: 28px; font-weight: 700; color: var(--btn);
  line-height: 1;
}
.stat-card .stat-label {
  font-size: 13px; color: var(--hint); margin-top: 4px;
}

/* Bar chart */
.chart-item { margin-bottom: 14px; }
.chart-header {
  display: flex; justify-content: space-between;
  font-size: 14px; margin-bottom: 5px;
}
.chart-header .proj-name { color: var(--text); font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart-header .proj-hrs { color: var(--hint); flex-shrink: 0; margin-left: 8px; }
.chart-bar-bg { height: 6px; background: var(--sec-bg); border-radius: 3px; overflow: hidden; }
.chart-bar-fill { height: 100%; background: var(--btn); border-radius: 3px; transition: width .5s cubic-bezier(.4,0,.2,1); }

/* Recent entries */
.entry-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--sep);
}
.entry-item:last-child { border-bottom: none; }
.entry-del-btn {
  position: absolute; top: 10px; right: 12px;
  background: none; border: none; color: var(--hint);
  font-size: 14px; cursor: pointer; padding: 4px 6px;
  touch-action: manipulation; line-height: 1;
  transition: color .15s;
}
.entry-del-btn:active { color: #ff3b30; }
.entry-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
.entry-proj { font-size: 15px; font-weight: 600; }
.entry-hrs { font-size: 15px; color: var(--btn); font-weight: 700; }
.entry-meta { font-size: 13px; color: var(--hint); }
.entry-desc { font-size: 13px; color: var(--hint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Projects ────────────────────────────────────── */
.project-item {
  padding: 14px 16px;
  border-bottom: 1px solid var(--sep);
  cursor: pointer;
  transition: background .12s;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
.project-item:last-child { border-bottom: none; }
.project-item:active { background: var(--sec-bg); }
.proj-row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.proj-name-big { font-size: 16px; font-weight: 600; }
.status-chip {
  font-size: 11px; font-weight: 600; padding: 3px 8px;
  border-radius: 20px; white-space: nowrap; flex-shrink: 0;
}
.chip-active { background: rgba(52,199,89,.15); color: #1a7a35; }
.chip-paused { background: rgba(255,149,0,.15); color: #b86800; }
.chip-done   { background: rgba(128,128,128,.15); color: #555; }
.proj-desc { font-size: 13px; color: var(--hint); line-height: 1.35; }

/* FAB */
.fab {
  position: fixed; bottom: 24px;
  right: 16px;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--btn); color: var(--btn-text);
  border: none; font-size: 28px; line-height: 1;
  cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.2);
  display: none; align-items: center; justify-content: center;
  z-index: 10;
  transition: transform .1s, opacity .1s;
}
.fab:active { transform: scale(.92); opacity: .85; }
#fab-add-proj { display: none; }
#page-projects.active ~ #fab-add-proj { display: flex; }

/* ── Bottom Sheet ────────────────────────────────── */
.sheet-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 100;
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
.sheet-overlay.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg);
  border-radius: 20px 20px 0 0;
  z-index: 101;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  max-height: 80dvh;
  display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}
.sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--sep); margin: 12px auto 4px;
  flex-shrink: 0;
}
.sheet-title {
  font-size: 17px; font-weight: 700;
  padding: 8px 20px 12px; flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
}
.sheet-close {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--sec-bg); border: none;
  color: var(--hint); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.sheet-body { overflow-y: auto; flex: 1; }

/* Picker list */
.picker-item {
  padding: 14px 20px; font-size: 17px;
  border-bottom: 1px solid var(--sep);
  cursor: pointer; display: flex; align-items: center; justify-content: space-between;
  transition: background .1s;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
.picker-item:last-child { border-bottom: none; }
.picker-item:active { background: var(--sec-bg); }
.picker-item.selected { color: var(--btn); font-weight: 600; }
.picker-check { width: 20px; height: 20px; fill: var(--btn); }

/* Project edit sheet */
.sheet-form { padding: 0 16px 16px; }
.field-label { font-size: 13px; color: var(--hint); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px; font-weight: 600; }
.field-input {
  width: 100%; padding: 12px 14px;
  background: var(--sec-bg); border: none; border-radius: 10px;
  font-size: 16px; color: var(--text); outline: none;
  font-family: inherit; margin-bottom: 14px;
}
.field-textarea {
  width: 100%; padding: 12px 14px;
  background: var(--sec-bg); border: none; border-radius: 10px;
  font-size: 16px; color: var(--text); outline: none;
  resize: none; height: 90px; font-family: inherit;
  line-height: 1.4; margin-bottom: 14px;
}
.field-input::placeholder, .field-textarea::placeholder { color: var(--hint); }

.date-row { display: flex; gap: 8px; margin-bottom: 14px; }
.date-row .field-input { margin-bottom: 0; }

.status-row { display: flex; gap: 8px; margin-bottom: 16px; }
.status-opt {
  flex: 1; padding: 10px 4px;
  border-radius: 10px; border: 1.5px solid var(--sep);
  background: transparent; cursor: pointer;
  font-size: 13px; font-weight: 600; text-align: center;
  color: var(--hint); transition: all .15s;
}
.status-opt.sel-active  { border-color: #34c759; background: rgba(52,199,89,.12); color: #1a7a35; }
.status-opt.sel-paused  { border-color: #ff9500; background: rgba(255,149,0,.12); color: #b86800; }
.status-opt.sel-done    { border-color: #8e8e93; background: rgba(142,142,147,.12); color: #555; }

/* ── Spinner ─────────────────────────────────────── */
.spinner {
  display: inline-block; width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
  border-radius: 50%; animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Toast ───────────────────────────────────────── */
#toast {
  position: fixed; bottom: 24px;
  left: 50%; transform: translateX(-50%) translateY(0);
  background: rgba(0,0,0,.78); color: #fff;
  padding: 10px 18px; border-radius: 22px;
  font-size: 14px; white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
  z-index: 200;
}
#toast.show { opacity: 1; }

/* ── Empty state ─────────────────────────────────── */
.empty { text-align: center; padding: 40px 20px; color: var(--hint); }
.empty svg { width: 56px; height: 56px; fill: var(--sep); margin-bottom: 12px; }
.empty p { font-size: 15px; }
</style>
</head>
<body>
<div id="app">

  <!-- ── Top Nav ── -->
  <nav id="nav">
    <button class="nav-btn active" id="nav-add" onclick="goTab('add')">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span>Запись</span>
    </button>
    <button class="nav-btn" id="nav-analytics" onclick="goTab('analytics')">
      <svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
      <span>Аналитика</span>
    </button>
    <button class="nav-btn" id="nav-projects" onclick="goTab('projects')">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" fill="currentColor" opacity=".25"/><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
      <span>Проекты</span>
    </button>
  </nav>

  <!-- ═══ PAGES ═══ -->
  <div id="pages">

    <!-- ── TAB 1: Добавить запись ── -->
    <div class="page active" id="page-add">

      <!-- FORM STATE -->
      <div id="add-form">
        <p class="sec-title">Новая запись</p>

        <div class="card">
          <div class="row tappable" id="date-row" onclick="openDatePicker()">
            <span class="row-label">Дата</span>
            <span class="row-value filled" id="date-display">—</span>
            <svg class="row-chevron" viewBox="0 0 20 20"><path d="M7 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="date" id="date-input" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;">
          </div>

          <div class="row">
            <span class="row-label">Часов</span>
            <div class="row-value">
              <div class="stepper">
                <button class="step-btn" onclick="changeHours(-0.5)">−</button>
                <span class="step-val" id="hours-val">0</span>
                <button class="step-btn" onclick="changeHours(0.5)">+</button>
              </div>
              <span class="step-unit">ч</span>
            </div>
          </div>

          <div class="row tappable" id="proj-row" onclick="openProjPicker()">
            <span class="row-label">Проект</span>
            <span class="row-value" id="proj-display">Выбрать</span>
            <svg class="row-chevron" viewBox="0 0 20 20"><path d="M7 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>

        <div class="card" style="padding:4px 16px 4px">
          <textarea id="desc-input" placeholder="Что сделал..." rows="3" style="width:100%;border:none;background:transparent;resize:none;font-size:15px;color:var(--text);padding:10px 0;outline:none;-webkit-appearance:none;vertical-align:top;font-family:inherit;"></textarea>
        </div>

        <button class="btn-primary" id="save-btn" onclick="saveEntry()">Сохранить</button>
      </div>

      <!-- SUCCESS STATE -->
      <div id="add-success">
        <div class="check-circle">
          <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h2>Сохранено!</h2>
        <p id="success-summary">—</p>
        <button class="btn-primary" onclick="resetForm()">Добавить ещё</button>
        <button class="btn-secondary" onclick="goTab('analytics')">Смотреть аналитику</button>
      </div>
    </div>

    <!-- ── TAB 2: Аналитика ── -->
    <div class="page" id="page-analytics">
      <p class="sec-title">Аналитика</p>

      <div class="period-tabs">
        <button class="period-tab active" onclick="setPeriod('week',this)">7 дней</button>
        <button class="period-tab" onclick="setPeriod('month',this)">Месяц</button>
        <button class="period-tab" onclick="setPeriod('all',this)">Всё время</button>
      </div>
      <div id="month-nav" style="display:none;align-items:center;justify-content:space-between;padding:6px 4px 2px;">
        <button onclick="shiftMonth(-1)" style="background:none;border:none;font-size:22px;color:var(--btn);cursor:pointer;padding:4px 10px;touch-action:manipulation;">‹</button>
        <span id="month-label" style="font-size:15px;font-weight:600;color:var(--text);"></span>
        <button onclick="shiftMonth(1)" id="month-next-btn" style="background:none;border:none;font-size:22px;color:var(--btn);cursor:pointer;padding:4px 10px;touch-action:manipulation;">›</button>
      </div>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-val" id="stat-total">—</div>
          <div class="stat-label">Всего часов</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-days">—</div>
          <div class="stat-label">Рабочих дней</div>
        </div>
      </div>

      <div class="card" id="chart-card" style="padding:16px;margin-bottom:20px;">
        <div id="chart-inner"><div class="empty"><p>Нет данных</p></div></div>
      </div>

      <p class="sec-title">Последние записи</p>
      <div class="card" id="entries-list">
        <div class="empty"><p>Нет записей</p></div>
      </div>
    </div>

    <!-- ── TAB 3: Проекты ── -->
    <div class="page" id="page-projects">
      <p class="sec-title">Проекты</p>
      <div class="card" id="projects-list">
        <div class="empty"><p>Загрузка...</p></div>
      </div>
    </div>

  </div><!-- /pages -->

</div>

<!-- ── FAB (Projects tab) ── -->
<button class="fab" id="fab-add-proj" onclick="openProjectSheet(null)">＋</button>

<!-- ── Project Picker Sheet ── -->
<div class="sheet-overlay" id="picker-overlay" onclick="closeProjPicker()"></div>
<div class="sheet" id="picker-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">
    Выбрать проект
    <button class="sheet-close" onclick="closeProjPicker()">✕</button>
  </div>
  <div class="sheet-body" id="picker-list"></div>
</div>

<!-- ── Project Edit/Create Sheet ── -->
<div class="sheet-overlay" id="proj-overlay" onclick="closeProjSheet()"></div>
<div class="sheet" id="proj-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="proj-sheet-title">
    Новый проект
    <button class="sheet-close" onclick="closeProjSheet()">✕</button>
  </div>
  <div class="sheet-body">
    <div class="sheet-form">
      <p class="field-label">Название</p>
      <input class="field-input" id="proj-name-input" placeholder="Название проекта">

      <p class="field-label">Текущая стадия</p>
      <input class="field-input" id="proj-stage-input" placeholder="Что сейчас происходит по проекту...">

      <p class="field-label">Описание</p>
      <textarea class="field-textarea" id="proj-desc-input" placeholder="Подробное описание проекта..."></textarea>

      <p class="field-label">Статус</p>
      <div class="status-row">
        <button class="status-opt sel-active" data-status="В процессе" onclick="selectStatus(this)">▶ В процессе</button>
        <button class="status-opt" data-status="На паузе" onclick="selectStatus(this)">⏸ На паузе</button>
        <button class="status-opt" data-status="Завершён" onclick="selectStatus(this)">✓ Завершён</button>
      </div>

      <p class="field-label">Даты</p>
      <div class="date-row">
        <input class="field-input" type="date" id="proj-date-start" title="Дата начала">
        <input class="field-input" type="date" id="proj-date-end" title="Дата окончания">
      </div>

      <button class="btn-primary" id="proj-save-btn" onclick="saveProject()">Сохранить проект</button>
      <button class="btn-delete" id="proj-delete-btn" onclick="deleteProject()" style="display:none">Удалить проект</button>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxS6PRj4w9SuTj9M1Q5W3RKdcq7N9ayAKl08Ow5JrzZHs4rsk-sNuSFIp6LefL2fULHrw/exec';
// ═══════════════════════════════════════════════════

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ── State ────────────────────────────────────────
let projects = [];    // [{name, stage, description, status, dateStart, dateEnd}]
let entries  = [];    // [{date, hours, project, description}]
let selProject = '';
let editingProject = null; // name of project being edited
let curPeriod = 'week';
let curMonthOffset = 0; // 0 = текущий месяц, -1 = прошлый и т.д.
let curTab = 'add';
let hoursVal = 0;

// ── Init ─────────────────────────────────────────
(async function init() {
  setTodayDate();
  await Promise.all([loadProjects(), loadEntries()]);
  renderProjectsList();
  renderAnalytics();
})();

// ── Date ─────────────────────────────────────────
function setTodayDate() {
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth()+1).padStart(2,'0');
  const d = String(today.getDate()).padStart(2,'0');
  document.getElementById('date-input').value = `${y}-${m}-${d}`;
  updateDateDisplay();
}

function updateDateDisplay() {
  const val = document.getElementById('date-input').value;
  if (!val) return;
  const [y,m,d] = val.split('-');
  const date = new Date(y, m-1, d);
  const opts = { day: 'numeric', month: 'long', year: 'numeric' };
  document.getElementById('date-display').textContent = date.toLocaleDateString('ru-RU', opts);
}

function openDatePicker() {
  const inp = document.getElementById('date-input');
  inp.style.position = 'fixed';
  inp.style.top = '50%';
  inp.style.left = '50%';
  inp.style.opacity = '0';
  inp.style.pointerEvents = 'auto';
  inp.style.width = '1px';
  inp.style.height = '1px';
  inp.showPicker?.();
  inp.focus();
  inp.addEventListener('change', () => { updateDateDisplay(); inp.blur(); }, { once: true });
  inp.addEventListener('blur', () => {
    inp.style.pointerEvents = 'none';
  }, { once: true });
}

// ── Hours stepper ────────────────────────────────
function changeHours(delta) {
  hoursVal = Math.max(0, Math.min(24, Math.round((hoursVal + delta) * 10) / 10));
  document.getElementById('hours-val').textContent = hoursVal;
  tg.HapticFeedback?.selectionChanged?.();
}

// ── Project picker ───────────────────────────────
function openProjPicker() {
  const list = document.getElementById('picker-list');
  // Только активные проекты в пикере
  // Показываем только активные — статус содержит "процесс" или пустой/неизвестный
  const active = projects.map((p, i) => ({p, i})).filter(({p}) => {
    const s = (p.status || '').toLowerCase();
    return !s.includes('завершен') && !s.includes('паузе') && !s.includes('пауза') && !s.includes('done') && !s.includes('завершён');
  });
  list.innerHTML = active.map(({p, i}) => `
    <div class="picker-item ${selProject===p.name?'selected':''}" data-idx="${i}">
      ${esc(p.name)}
      ${selProject===p.name ? '<svg class="picker-check" viewBox="0 0 20 20"><path d="M4 10l4 4 8-8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>' : ''}
    </div>
  `).join('') || '<div class="empty"><p>Нет активных проектов</p></div>';

  // Делегированный обработчик — надёжно работает на iOS/Telegram
  list.onclick = null;
  list.addEventListener('click', function handler(e) {
    const item = e.target.closest('[data-idx]');
    if (item) {
      list.removeEventListener('click', handler);
      selectProj(projects[+item.dataset.idx].name);
    }
  });

  document.getElementById('picker-overlay').classList.add('open');
  document.getElementById('picker-sheet').classList.add('open');
}

function closeProjPicker() {
  document.getElementById('picker-overlay').classList.remove('open');
  document.getElementById('picker-sheet').classList.remove('open');
}

function selectProj(name) {
  selProject = name;
  const el = document.getElementById('proj-display');
  el.textContent = name;
  el.classList.add('filled');
  closeProjPicker();
  tg.HapticFeedback?.selectionChanged?.();
}

// ── Save entry ───────────────────────────────────
async function saveEntry() {
  const date = document.getElementById('date-input').value;
  const desc = document.getElementById('desc-input').value.trim();

  if (!date)       { showToast('⚠️ Выбери дату'); return; }
  if (hoursVal<=0) { showToast('⚠️ Укажи кол-во часов'); return; }
  if (!selProject) { showToast('⚠️ Выбери проект'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    const params = new URLSearchParams({
      action: 'add', date, hours: hoursVal, project: selProject, description: desc
    });
    const res  = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: params });
    const json = await res.json();
    if (json.error) throw new Error(json.error);

    // Add to local entries
    entries.unshift({ date, hours: hoursVal, project: selProject, description: desc });

    tg.HapticFeedback?.notificationOccurred?.('success');

    // Show success
    document.getElementById('add-form').style.display = 'none';
    const s = document.getElementById('add-success');
    s.style.display = 'flex';
    document.getElementById('success-summary').textContent =
      `${hoursVal} ч · ${selProject}` + (desc ? ` · ${desc}` : '');

    renderAnalytics();
  } catch(e) {
    tg.HapticFeedback?.notificationOccurred?.('error');
    showToast('❌ ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Сохранить';
  }
}

function resetForm() {
  document.getElementById('add-form').style.display = '';
  document.getElementById('add-success').style.display = 'none';
  hoursVal = 0;
  document.getElementById('hours-val').textContent = '0';
  document.getElementById('desc-input').value = '';
  selProject = '';
  document.getElementById('proj-display').textContent = 'Выбрать';
  document.getElementById('proj-display').classList.remove('filled');
  document.getElementById('save-btn').disabled = false;
  document.getElementById('save-btn').textContent = 'Сохранить';
  setTodayDate();
}

// ── Load data ─────────────────────────────────────
async function loadProjects() {
  try {
    const res  = await fetch(APPS_SCRIPT_URL + '?action=projects');
    const json = await res.json();
    projects = json.projects || [];
  } catch(e) { projects = []; }
}

async function loadEntries() {
  try {
    const res  = await fetch(APPS_SCRIPT_URL + '?action=entries');
    const json = await res.json();
    entries = (json.entries || []).reverse(); // newest first
  } catch(e) { entries = []; }
}

// ── Analytics ─────────────────────────────────────
const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function setPeriod(p, el) {
  curPeriod = p;
  curMonthOffset = 0;
  document.querySelectorAll('.period-tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  const nav = document.getElementById('month-nav');
  nav.style.display = p === 'month' ? 'flex' : 'none';
  updateMonthLabel();
  renderAnalytics();
}

function shiftMonth(dir) {
  const now = new Date();
  const target = new Date(now.getFullYear(), now.getMonth() + curMonthOffset + dir, 1);
  // не позволяем уйти в будущее
  if (target > new Date(now.getFullYear(), now.getMonth(), 1)) return;
  curMonthOffset += dir;
  updateMonthLabel();
  // скрываем кнопку "вперёд" если уже текущий месяц
  document.getElementById('month-next-btn').style.opacity = curMonthOffset >= 0 ? '0.3' : '1';
  renderAnalytics();
}

function updateMonthLabel() {
  if (curPeriod !== 'month') return;
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth() + curMonthOffset, 1);
  document.getElementById('month-label').textContent = MONTHS_RU[d.getMonth()] + ' ' + d.getFullYear();
  document.getElementById('month-next-btn').style.opacity = curMonthOffset >= 0 ? '0.3' : '1';
}

function filterByPeriod(ents) {
  const now = new Date();
  if (curPeriod === 'week') {
    const start = new Date(now); start.setDate(now.getDate() - 6); start.setHours(0,0,0,0);
    return ents.filter(e => new Date(e.date) >= start);
  }
  if (curPeriod === 'month') {
    const d = new Date(now.getFullYear(), now.getMonth() + curMonthOffset, 1);
    const start = new Date(d.getFullYear(), d.getMonth(), 1);
    const end   = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    return ents.filter(e => { const ed = new Date(e.date); return ed >= start && ed < end; });
  }
  return ents;
}

function renderAnalytics() {
  const filtered = filterByPeriod(entries);

  // Stats
  const total = filtered.reduce((s,e) => s + Number(e.hours), 0);
  const days  = new Set(filtered.map(e => e.date)).size;
  document.getElementById('stat-total').textContent = fmtHrs(total);
  document.getElementById('stat-days').textContent  = days;

  // Chart — hours by project
  const byProj = {};
  filtered.forEach(e => {
    byProj[e.project] = (byProj[e.project]||0) + Number(e.hours);
  });
  const sorted = Object.entries(byProj).sort((a,b)=>b[1]-a[1]);
  const max    = sorted[0]?.[1] || 1;

  const chartEl = document.getElementById('chart-inner');
  if (!sorted.length) {
    chartEl.innerHTML = '<div class="empty"><p>Нет данных за период</p></div>';
  } else {
    chartEl.innerHTML = sorted.map(([name, hrs]) => `
      <div class="chart-item">
        <div class="chart-header">
          <span class="proj-name">${esc(name)}</span>
          <span class="proj-hrs">${fmtHrs(hrs)}</span>
        </div>
        <div class="chart-bar-bg">
          <div class="chart-bar-fill" style="width:${Math.round(hrs/max*100)}%"></div>
        </div>
      </div>
    `).join('');
  }

  // Entries list (last 15)
  const listEl = document.getElementById('entries-list');
  if (!filtered.length) {
    listEl.innerHTML = '<div class="empty"><p>Нет записей за период</p></div>';
  } else {
    listEl.innerHTML = filtered.slice(0,15).map((e, i) => `
      <div class="entry-item" data-entry-idx="${i}" style="position:relative;">
        <div class="entry-top">
          <span class="entry-proj">${esc(e.project)}</span>
          <span class="entry-hrs">${fmtHrs(Number(e.hours))}</span>
        </div>
        <div class="entry-meta">${fmtDate(e.date)}</div>
        ${e.description ? `<div class="entry-desc">${esc(e.description)}</div>` : ''}
        <button class="entry-del-btn" data-entry-idx="${i}" title="Удалить">✕</button>
      </div>
    `).join('');
    // event delegation для кнопок удаления
    listEl.onclick = null;
    listEl.addEventListener('click', function h(e) {
      const btn = e.target.closest('.entry-del-btn');
      if (btn) {
        const idx = +btn.dataset.entryIdx;
        deleteEntry(filtered[idx]);
      }
    });
  }
}

// ── Projects list ──────────────────────────────────
function renderProjectsList() {
  const el = document.getElementById('projects-list');
  if (!projects.length) {
    el.innerHTML = '<div class="empty"><p>Нет проектов. Нажми + чтобы добавить.</p></div>';
    return;
  }
  el.innerHTML = projects.map((p, i) => {
    const chipCls = p.status==='На паузе' ? 'chip-paused' : p.status==='Завершён' ? 'chip-done' : 'chip-active';
    const subtitle = p.stage || p.description || '';
    return `
      <div class="project-item" data-proj-idx="${i}">
        <div class="proj-row1">
          <span class="proj-name-big">${esc(p.name)}</span>
          <span class="status-chip ${chipCls}">${esc(p.status||'В процессе')}</span>
        </div>
        ${subtitle ? `<div class="proj-desc">${esc(subtitle)}</div>` : ''}
      </div>
    `;
  }).join('');

  // Event delegation — надёжно на iOS/Telegram WebView
  el.onclick = null;
  el.addEventListener('click', function handler(e) {
    const item = e.target.closest('[data-proj-idx]');
    if (item) openProjectSheet(projects[+item.dataset.projIdx].name);
  });
}

// ── Project sheet ──────────────────────────────────
function openProjectSheet(projName) {
  editingProject = projName;
  const isNew = projName === null;
  document.getElementById('proj-sheet-title').childNodes[0].textContent = isNew ? 'Новый проект' : 'Редактировать';

  document.getElementById('proj-delete-btn').style.display = isNew ? 'none' : 'block';

  if (isNew) {
    document.getElementById('proj-name-input').value = '';
    document.getElementById('proj-stage-input').value = '';
    document.getElementById('proj-desc-input').value = '';
    document.getElementById('proj-date-start').value = '';
    document.getElementById('proj-date-end').value = '';
    setStatusUI('В процессе');
    document.getElementById('proj-name-input').disabled = false;
  } else {
    const p = projects.find(x => x.name === projName);
    if (!p) return;
    document.getElementById('proj-name-input').value = p.name;
    document.getElementById('proj-name-input').disabled = true; // can't rename
    document.getElementById('proj-stage-input').value = p.stage || '';
    document.getElementById('proj-desc-input').value = p.description || '';
    document.getElementById('proj-date-start').value = p.dateStart || '';
    document.getElementById('proj-date-end').value = p.dateEnd || '';
    setStatusUI(p.status || 'В процессе');
  }

  document.getElementById('proj-overlay').classList.add('open');
  document.getElementById('proj-sheet').classList.add('open');
}

function closeProjSheet() {
  document.getElementById('proj-overlay').classList.remove('open');
  document.getElementById('proj-sheet').classList.remove('open');
}

function setStatusUI(status) {
  document.querySelectorAll('.status-opt').forEach(btn => {
    btn.className = 'status-opt';
    if (btn.dataset.status === status) {
      if (status==='В процессе') btn.classList.add('sel-active');
      else if (status==='На паузе') btn.classList.add('sel-paused');
      else btn.classList.add('sel-done');
    }
  });
}

function selectStatus(btn) {
  setStatusUI(btn.dataset.status);
}

function getSelectedStatus() {
  const sel = document.querySelector('.status-opt.sel-active, .status-opt.sel-paused, .status-opt.sel-done');
  return sel ? sel.dataset.status : 'В процессе';
}

async function saveProject() {
  const name      = document.getElementById('proj-name-input').value.trim();
  const stage     = document.getElementById('proj-stage-input').value.trim();
  const desc      = document.getElementById('proj-desc-input').value.trim();
  const status    = getSelectedStatus();
  const dateStart = document.getElementById('proj-date-start').value;
  const dateEnd   = document.getElementById('proj-date-end').value;
  const isNew     = editingProject === null;

  if (!name) { showToast('⚠️ Введи название'); return; }

  const btn = document.getElementById('proj-save-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    const params = new URLSearchParams({
      action: isNew ? 'addProject' : 'updateProject',
      name, stage, description: desc, status, dateStart, dateEnd
    });
    const res  = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: params });
    const json = await res.json();
    if (json.error) throw new Error(json.error);

    // Update local state
    if (isNew) {
      projects.push({ name, stage, description: desc, status, dateStart, dateEnd });
    } else {
      const p = projects.find(x => x.name === editingProject);
      if (p) { p.stage = stage; p.description = desc; p.status = status; p.dateStart = dateStart; p.dateEnd = dateEnd; }
    }

    renderProjectsList();
    tg.HapticFeedback?.notificationOccurred?.('success');
    showToast(isNew ? '✅ Проект создан' : '✅ Сохранено');
    closeProjSheet();
  } catch(e) {
    tg.HapticFeedback?.notificationOccurred?.('error');
    showToast('❌ ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Сохранить проект';
  }
}

// ── Delete project ────────────────────────────────
async function deleteEntry(entry) {
  if (!confirm(`Удалить запись?\n${entry.project} · ${fmtDate(entry.date)} · ${fmtHrs(Number(entry.hours))}`)) return;
  try {
    const params = new URLSearchParams({ action: 'deleteEntry', date: entry.date, project: entry.project, hours: entry.hours });
    const res  = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: params });
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    // удаляем из локального массива
    const idx = entries.findIndex(e => e.date === entry.date && e.project === entry.project && String(e.hours) === String(entry.hours));
    if (idx !== -1) entries.splice(idx, 1);
    tg.HapticFeedback?.notificationOccurred?.('success');
    showToast('🗑 Запись удалена');
    renderAnalytics();
  } catch(e) {
    tg.HapticFeedback?.notificationOccurred?.('error');
    showToast('❌ ' + e.message);
  }
}

async function deleteProject() {
  if (!editingProject) return;
  if (!confirm(`Удалить проект «${editingProject}»?`)) return;

  const btn = document.getElementById('proj-delete-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="border-color:rgba(255,59,48,.3);border-top-color:#ff3b30"></span>';

  try {
    const params = new URLSearchParams({ action: 'deleteProject', name: editingProject });
    const res  = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: params });
    const json = await res.json();
    if (json.error) throw new Error(json.error);

    projects = projects.filter(p => p.name !== editingProject);
    renderProjectsList();
    tg.HapticFeedback?.notificationOccurred?.('success');
    showToast('🗑 Проект удалён');
    closeProjSheet();
  } catch(e) {
    tg.HapticFeedback?.notificationOccurred?.('error');
    showToast('❌ ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Удалить проект';
  }
}

// ── Tab navigation ────────────────────────────────
function goTab(tab) {
  curTab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');

  const fab = document.getElementById('fab-add-proj');
  fab.style.display = tab==='projects' ? 'flex' : 'none';

  if (tab === 'analytics') renderAnalytics();
  if (tab === 'projects')  renderProjectsList();

  tg.HapticFeedback?.selectionChanged?.();
}

// ── Helpers ───────────────────────────────────────
function fmtHrs(h) {
  if (h === Math.floor(h)) return h + ' ч';
  return h.toFixed(1) + ' ч';
}
function fmtDate(d) {
  if (!d) return '';
  const [y,m,day] = d.split('-');
  const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  return `${parseInt(day)} ${months[parseInt(m)-1]} ${y}`;
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function showToast(msg, dur=2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), dur);
}
</script>
</body>
